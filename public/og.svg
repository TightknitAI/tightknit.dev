<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0a0a0a" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream base + grid -->
  <rect width="1200" height="630" fill="#f3ede0"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- decor blocks: cyan top-right, yellow bottom-right -->
  <g transform="translate(1058 60) rotate(-6)">
    <rect x="8" y="8" width="86" height="86" fill="#0a0a0a"/>
    <rect x="0" y="0" width="86" height="86" fill="#00e0ff" stroke="#0a0a0a" stroke-width="4"/>
  </g>
  <g transform="translate(1058 442) rotate(-5)">
    <rect x="8" y="8" width="78" height="78" fill="#0a0a0a"/>
    <rect x="0" y="0" width="78" height="78" fill="#ffe600" stroke="#0a0a0a" stroke-width="4"/>
  </g>

  <!-- top row: pixel heart + wordmark (heart points match src/components/Heart.astro) -->
  <g transform="translate(60 38)">
    <g transform="scale(0.72)">
      <polygon points="15,9 33,9 33,21 39,21 39,9 57,9 57,15 63,15 63,39 57,39 57,45 51,45 51,51 45,51 45,57 39,57 39,63 33,63 33,57 27,57 27,51 21,51 21,45 15,45 15,39 9,39 9,15 15,15" fill="#0a0a0a"/>
      <polygon points="11,5 29,5 29,17 35,17 35,5 53,5 53,11 59,11 59,35 53,35 53,41 47,41 47,47 41,47 41,53 35,53 35,59 29,59 29,53 23,53 23,47 17,47 17,41 11,41 11,35 5,35 5,11 11,11" fill="#ff2d7b"/>
    </g>
    <text x="64" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="32" fill="#0a0a0a" letter-spacing="-0.5">
      tightknit<tspan fill="#ff2d7b">.</tspan>dev
    </text>
  </g>

  <!-- big stacked headline -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" letter-spacing="-5">
    <!-- TOOLS -->
    <text x="60" y="248" font-size="138" fill="#0a0a0a">TOOLS</text>

    <!-- FOR (ink) + SLACK (pink with hero-style stacked 3d shadow) -->
    <text x="60" y="368" font-size="138" fill="#0a0a0a">FOR</text>
    <text x="368" y="376" font-size="138" fill="#0a0a0a">SLACK</text>
    <text x="364" y="372" font-size="138" fill="#0a0a0a">SLACK</text>
    <text x="360" y="368" font-size="138" fill="#ff2d7b">SLACK</text>

    <!-- + AGENTS. -->
    <text x="60" y="488" font-size="138" fill="#0a0a0a">+ AGENTS.</text>
  </g>

  <!-- bottom marquee strip -->
  <g transform="translate(0 560)">
    <rect x="0" y="0" width="1200" height="70" fill="#0a0a0a"/>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="16" fill="#f3ede0" letter-spacing="4">
      <text x="60" y="44">OPEN SOURCE</text>
      <text x="270" y="44" fill="#ffe600">★</text>
      <text x="305" y="44">BUILT IN PUBLIC</text>
      <text x="545" y="44" fill="#ff2d7b">●</text>
      <text x="580" y="44">TYPESCRIPT-FIRST</text>
      <text x="845" y="44" fill="#00e0ff">◆</text>
      <text x="880" y="44">FORK IT. SHIP IT.</text>
      <text x="1130" y="44" fill="#ffe600">★</text>
    </g>
  </g>
</svg>
