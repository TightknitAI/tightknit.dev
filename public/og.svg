<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#f4ecd8"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- floating blocks -->
  <g transform="translate(990,70)">
    <rect x="8" y="8" width="120" height="120" fill="#0a0a0a"/>
    <rect width="120" height="120" fill="#ff3366" stroke="#0a0a0a" stroke-width="4"/>
  </g>
  <g transform="translate(70,450) rotate(12)">
    <rect x="6" y="6" width="90" height="90" fill="#0a0a0a"/>
    <rect width="90" height="90" fill="#ffd84d" stroke="#0a0a0a" stroke-width="4"/>
  </g>
  <g transform="translate(1040,440)">
    <rect x="6" y="6" width="70" height="70" fill="#0a0a0a"/>
    <rect width="70" height="70" fill="#4dd5ff" stroke="#0a0a0a" stroke-width="4"/>
  </g>

  <!-- eyebrow -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-weight="600" font-size="22" letter-spacing="4" fill="#0a0a0a">
    <rect x="72" y="92" width="14" height="14" fill="#ff3366"/>
    <text x="100" y="106" opacity="0.85">TIGHTKNIT.DEV — OPEN SOURCE</text>
  </g>

  <!-- main wordmark (stacked 3D look) -->
  <g font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="172" letter-spacing="-6">
    <!-- shadow layer -->
    <g fill="#0a0a0a" opacity="0.18">
      <text x="86" y="248">TOOLS</text>
      <text x="86" y="396">FOR SLACK</text>
      <text x="86" y="544">+ AGENTS.</text>
    </g>
    <!-- main layer -->
    <g fill="#0a0a0a">
      <text x="80" y="242">TOOLS</text>
      <text x="80" y="390">FOR SLACK</text>
      <text x="80" y="538">+ AGENTS.</text>
    </g>
  </g>

  <!-- bottom bar -->
  <rect x="0" y="588" width="1200" height="42" fill="#0a0a0a"/>
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-weight="600" font-size="18" letter-spacing="4" fill="#f4ecd8">
    <text x="80" y="616">OPEN SOURCE   ★   BUILT IN PUBLIC   ●   TYPESCRIPT-FIRST   ◆   FORK IT. SHIP IT.</text>
  </g>
</svg>
